<!doctype html>
<html lang="tr">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Konşimento</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Yerleşim: seyir haritası solda sabit durur, sağda konşimento masası (sekmeler). Telefonda harita üstte, masa altta. */
:root{
  --sea:#e4edf0; --paper:#f6f9f8; --raise:#ffffff; --land:#cdbb7c; --ink:#15293a; --muted:#536776;
  --line:#bccbd2; --depth:#7fb0c6; --magenta:#a81c66; --on-magenta:#ffffff;
  --good:#1a7146; --warn:#925600; --bad:#b0302a;
  --c-red:#9a3f30; --c-blue:#1e5c96; --c-green:#2a6a50; --c-orange:#b85c12;
  --f-display:'Big Shoulders Display','Barlow Condensed','Arial Narrow',sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --sea:#0a151e; --paper:#111f2a; --raise:#182a38; --land:#575134; --ink:#dbe6ec; --muted:#8b9eab;
  --line:#293c4c; --depth:#35657b; --magenta:#ea6cb2; --on-magenta:#1d0a14;
  --good:#5cc490; --warn:#e2a84e; --bad:#f08077;
  --c-red:#d67663; --c-blue:#70abe4; --c-green:#68ba97; --c-orange:#e99a52; color-scheme:dark } }
:root[data-theme="dark"]{
  --sea:#0a151e; --paper:#111f2a; --raise:#182a38; --land:#575134; --ink:#dbe6ec; --muted:#8b9eab;
  --line:#293c4c; --depth:#35657b; --magenta:#ea6cb2; --on-magenta:#1d0a14;
  --good:#5cc490; --warn:#e2a84e; --bad:#f08077;
  --c-red:#d67663; --c-blue:#70abe4; --c-green:#68ba97; --c-orange:#e99a52; color-scheme:dark }

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--sea);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
button,select{font:inherit;color:inherit}
h1,h2,h3,p,ul{margin:0}
ul{padding:0;list-style:none}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.pos{color:var(--good)} .neg{color:var(--bad)} .warn{color:var(--warn)}
:focus-visible{outline:2px solid var(--magenta);outline-offset:2px}

/* köprüüstü: üst gösterge şeridi */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.bridge{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--paper);border-bottom:1px solid var(--ink)}
.bridge-in{max-width:1360px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;align-items:center;gap:8px 22px}
.mark{font:800 27px/1 var(--f-display);letter-spacing:.05em;display:flex;align-items:center;gap:9px;white-space:nowrap}
.mark i{width:11px;height:11px;background:var(--magenta);transform:rotate(45deg);flex:none}
.mark small{font:500 11px/1 var(--f-mono);letter-spacing:.06em;color:var(--muted)}
.hud{display:flex;flex-wrap:wrap;gap:4px 20px;flex:1;min-width:0}
.stat{display:flex;flex-direction:column;gap:1px}
.stat span{font:500 10px/1.2 var(--f-mono);letter-spacing:.08em;color:var(--muted)}
.stat b{font:500 15px/1.2 var(--f-mono);font-variant-numeric:tabular-nums}
.bridge-btns{display:flex;gap:8px;margin-left:auto}

.btn{border:1px solid var(--ink);background:transparent;padding:7px 12px;min-height:36px;border-radius:2px;cursor:pointer;font-weight:500;line-height:1.2}
.btn:hover:not(:disabled){background:var(--ink);color:var(--paper)}
.btn.go{background:var(--magenta);border-color:var(--magenta);color:var(--on-magenta);font:800 18px/1 var(--f-display);letter-spacing:.06em;padding:8px 16px}
.btn.go:hover:not(:disabled){filter:brightness(1.12);background:var(--magenta);color:var(--on-magenta)}
.btn.sm{padding:4px 9px;min-height:30px;font-size:13px}
.btn.quiet{border-color:var(--line)}
.btn:disabled{opacity:.42;cursor:not-allowed}

.wrap{max-width:1360px;margin:0 auto;padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px;align-items:start}
.chart-col,.desk{min-width:0}
@media (min-width:960px){
  .wrap{grid-template-columns:minmax(0,1.12fr) minmax(0,1fr)}
  .chart-col{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hud-h,62px) + 14px)}
}
.chart{border:3px double var(--ink);background:var(--sea);line-height:0}
.chart canvas{display:block;width:100%}
.chart-foot{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:space-between;margin-top:8px;font-size:12.5px;color:var(--muted)}
.key{display:flex;flex-wrap:wrap;gap:4px 14px}
.key span{display:inline-flex;align-items:center;gap:5px}
.sw{width:9px;height:9px;display:inline-block;flex:none}
.kicker{font:500 11px/1.2 var(--f-mono);letter-spacing:.1em;color:var(--muted)}
.notices{margin-top:14px;border-top:1px solid var(--ink);padding-top:10px;display:grid;gap:6px}
.notice{display:flex;gap:10px;align-items:baseline;font-size:14px}
.notice b{font-weight:600}
.notice .num{color:var(--magenta);font-size:12px;white-space:nowrap}

/* giriş */
.intro h1{font:800 clamp(34px,5vw,54px)/.98 var(--f-display);letter-spacing:.01em;text-wrap:balance;margin:6px 0 12px}
.intro>p{max-width:60ch}
.scen{display:grid;gap:14px;margin-top:20px}
@media (min-width:560px){.scen{grid-template-columns:1fr 1fr}}
.scen article{border:1px solid var(--ink);background:var(--paper);padding:16px;display:flex;flex-direction:column;gap:10px}
.scen h2{font:800 30px/1 var(--f-display);letter-spacing:.04em}
.scen .role{font:500 11px/1.3 var(--f-mono);letter-spacing:.06em;color:var(--magenta)}
.scen ul{display:grid;gap:6px;font-size:14px;color:var(--muted);flex:1}
.scen li{padding-left:14px;position:relative}
.scen li::before{content:"";position:absolute;left:0;top:.58em;width:6px;height:1px;background:var(--ink)}
.resume{margin-top:16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* masa */
.tabs{display:flex;border-bottom:1px solid var(--ink);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;padding:9px 13px 8px;cursor:pointer;font:600 17px/1 var(--f-display);letter-spacing:.07em;white-space:nowrap;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.tab .num{font-size:11px;margin-left:4px}
.panel{padding-top:14px;display:grid;gap:12px}
.hint{font-size:13.5px;color:var(--muted)}
details.how{border:1px dashed var(--line);padding:8px 12px;font-size:14px}
details.how summary{cursor:pointer;font-weight:600}
details.how ul{margin-top:8px;display:grid;gap:5px;color:var(--muted)}
.empty{border:1px dashed var(--line);padding:22px 16px;text-align:center;color:var(--muted)}

/* konşimento formu */
.bl{border:1px solid var(--ink);background:var(--paper)}
.bl-head{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:space-between;align-items:center;padding:7px 10px;border-bottom:1px solid var(--ink)}
.bl-head .num{font-size:12px;letter-spacing:.04em}
.stamp{font:800 14px/1 var(--f-display);letter-spacing:.14em;color:var(--magenta);border:1.5px solid var(--magenta);padding:3px 7px 2px;transform:rotate(-3deg)}
.bl-grid{display:grid;grid-template-columns:1fr 1fr}
.bl-grid>div{padding:6px 10px;border-bottom:1px solid var(--line);min-width:0;overflow-wrap:anywhere}
.bl-grid>div:nth-child(odd){border-right:1px solid var(--line)}
.bl-grid label,.lbl{display:block;font:500 9.5px/1.3 var(--f-mono);letter-spacing:.1em;color:var(--muted)}
.carrs{display:grid;gap:6px;padding:10px}
@media (min-width:520px){.carrs{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}}
.carr{border:1px solid var(--line);background:var(--raise);padding:8px 10px;text-align:left;cursor:pointer;display:grid;gap:2px;border-radius:2px;font-size:13px;min-width:0}
.carr:hover:not(:disabled){border-color:var(--ink)}
.carr:disabled{opacity:.45;cursor:not-allowed}
.carr b{display:flex;align-items:center;gap:6px;font-weight:600;font-size:13.5px}
.carr .num{font-size:12px}
.bl-foot{display:flex;flex-wrap:wrap;gap:8px;padding:0 10px 10px}

.card{border:1px solid var(--line);background:var(--paper);padding:11px 12px;display:grid;gap:8px;min-width:0}
.card-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;align-items:baseline}
.card-top h3{font:600 15px/1.25 var(--f-body)}
.card-top .num{font-size:12.5px}
.row{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13.5px}
.row.sp{justify-content:space-between}
.pill{font:500 11px/1 var(--f-mono);letter-spacing:.04em;padding:4px 7px;border:1px solid currentColor;border-radius:2px;white-space:nowrap}
.bar{height:7px;background:var(--line);position:relative;min-width:80px;flex:1}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--ink);border-radius:2px;overflow:hidden}
.seg button{border:0;background:transparent;padding:4px 9px;min-height:30px;cursor:pointer;font-size:13px}
.seg button+button{border-left:1px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
select{background:var(--raise);border:1px solid var(--ink);padding:5px 8px;min-height:32px;border-radius:2px;max-width:100%}
.spark{color:var(--muted);flex:none}
.step{display:inline-flex;align-items:center;gap:6px}
.step .num{min-width:44px;text-align:center}
.h3{font:600 18px/1.1 var(--f-display);letter-spacing:.08em;margin-top:6px}
.log li{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.log .num{color:var(--muted);font-size:12px;flex:none;width:34px}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right}
dl{margin:0}

/* rapor */
.dlg{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,var(--sea) 72%,transparent);display:flex;align-items:center;justify-content:center;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--paper);border:3px double var(--ink);width:min(560px,100%);max-height:100%;overflow:auto;padding:18px;display:grid;gap:12px}
.sheet h2{font:800 30px/1 var(--f-display);letter-spacing:.04em}
.news{border-left:3px solid var(--magenta);padding:2px 0 2px 10px}
.news b{display:block;font-weight:600}
.news span{font-size:13.5px;color:var(--muted)}
.ledger{display:grid;gap:0;font-size:13.5px}
.ledger li{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid var(--line)}
.ledger li span:first-child{min-width:0;overflow-wrap:anywhere}
.ledger .num{white-space:nowrap}
.totals{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;border-top:1px solid var(--ink);padding-top:10px}
.big{font:800 44px/1 var(--f-display);letter-spacing:.02em}
.sheet-foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end}
@media (max-width:520px){ .mark{font-size:23px} .mark small{display:none} .stat b{font-size:13.5px} .hud{gap:4px 14px;order:3;flex-basis:100%} }
</style>

<div id="app" lang="tr">
  <header class="bridge" id="bridge"><div class="bridge-in">
    <div class="mark"><i></i>KONŞİMENTO <small id="mode-tag">30 HAFTA · 9 LİMAN · 10 HAT</small></div>
    <div class="hud" id="hud"></div>
    <div class="bridge-btns" id="bridge-btns"></div>
  </div></header>
  <div class="wrap">
    <section class="chart-col" aria-label="Seyir haritası">
      <div class="chart"><canvas id="cv" role="img" aria-label="Limanları ve hatları gösteren dünya haritası"></canvas></div>
      <div class="chart-foot"><div class="key" id="key"></div><div id="hi-name" class="num"></div></div>
      <div class="notices" id="notices"></div>
    </section>
    <section class="desk" id="desk"></section>
  </div>
  <div class="dlg" id="dlg" hidden></div>
</div>

<script>
(() => {
'use strict';
document.documentElement.lang = 'tr';
const $ = s => document.querySelector(s);
const rnd = (a, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const nf = new Intl.NumberFormat('tr-TR');
const money = v => { v = Math.round(v); const s = v < 0 ? '−' : '', a = Math.abs(v);
  return a >= 1e6 ? `${s}$${(a / 1e6).toLocaleString('tr-TR', {minimumFractionDigits: 2, maximumFractionDigits: 2})} Mn` : `${s}$${nf.format(a)}`; };
const signed = v => (v >= 0 ? '+' : '') + money(v);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const WEEKS = 30;

/* ───────── Dünya: limanlar, hatlar ───────── */
const PORTS = {
  SHA: {n: 'Şanghay', lon: 121.8, lat: 31, lab: 'r'}, SIN: {n: 'Singapur', lon: 103.9, lat: 1.2, lab: 'b'},
  JEA: {n: 'Cebel Ali', lon: 55, lat: 25.1, lab: 'b'}, IST: {n: 'İstanbul', lon: 28.7, lat: 40.9, lab: 't'},
  RTM: {n: 'Rotterdam', lon: 4, lat: 52, lab: 't'}, NYC: {n: 'New York', lon: -74, lat: 40.5, lab: 'r'},
  LAX: {n: 'Los Angeles', lon: -118.3, lat: 33.7, lab: 'r'}, SSZ: {n: 'Santos', lon: -46.3, lat: -24, lab: 'r'},
  DUR: {n: 'Durban', lon: 31.1, lat: -29.9, lab: 'r'},
};
const cat = (...a) => { const o = []; a.forEach(s => s.forEach(p => { const q = o[o.length - 1]; if (!(q && p && q[0] === p[0] && q[1] === p[1])) o.push(p); })); return o; };
const rev = a => a.slice().reverse();
const shaSin = [[121.8, 31], [123, 27.5], [119.8, 24], [115.5, 20], [111.5, 13], [107.5, 6], [104.8, 1.7], [103.9, 1.2]];
const malacca = [[103.9, 1.2], [101.6, 1.9], [99.6, 4.4], [96.8, 6.4], [93.5, 6.2], [82, 5.2], [78, 6.5]];
const toGulf = [[70, 14], [63.5, 21], [60, 24], [57.3, 25.7], [56.6, 26.7], [55.6, 26.1], [55, 25.1]];
const redSea = [[43.3, 12.6], [41, 16.5], [38.3, 21], [35.6, 26], [33.4, 28.6], [32.5, 30], [32.4, 31.6]];
const toSuez = cat([[65, 11.5], [52, 13.2], [45.2, 12.1]], redSea);
const suezIst = [[32.4, 31.6], [29, 33.6], [26.6, 35.5], [25.4, 37.5], [25.7, 39.5], [26.8, 40.4], [28.7, 40.9]];
const suezGib = [[32.4, 31.6], [25, 34], [17, 35.7], [11.6, 37.7], [5, 37.6], [-2, 36.2], [-5.5, 36]];
const chan = [[4, 52], [3, 51.7], [1.6, 51.05], [0, 50.3], [-3.5, 49.7], [-6.5, 48.4]];
const gibRtm = cat([[-5.5, 36], [-8.5, 36.3], [-10.2, 38.5], [-10.3, 43.6]], rev(chan));
const istGib = [[28.7, 40.9], [26.8, 40.4], [25.7, 39.5], [25, 37.6], [23.2, 35.8], [17, 35.9], [11.6, 37.7], [5, 37.6], [-2, 36.2], [-5.5, 36]];
const gulfAden = [[55, 25.1], [55.6, 26.1], [56.6, 26.7], [57.3, 25.7], [60.3, 22.8], [59.6, 19], [56, 15.6], [51, 13.4], [45.2, 12.1]];
const LANES = [
  {id: 'AE', name: 'Asya – Kuzey Avrupa', a: 'SHA', b: 'RTM', weeks: 4, head: 1800, back: 700, dem: [3200, 1500], suez: true, path: cat(shaSin, malacca, toSuez, suezGib, gibRtm)},
  {id: 'AM', name: 'Asya – Akdeniz', a: 'SHA', b: 'IST', weeks: 3, head: 1500, back: 600, dem: [1800, 800], suez: true, path: cat(shaSin, malacca, toSuez, suezIst)},
  {id: 'TP', name: 'Transpasifik', a: 'SHA', b: 'LAX', weeks: 3, head: 1700, back: 500, dem: [2800, 1100], path: [[121.8, 31], [126, 30.3], [132, 30], [142, 34], [152, 38], null, [-128, 37.5], [-122, 34.6], [-118.3, 33.7]]},
  {id: 'TA', name: 'Transatlantik', a: 'RTM', b: 'NYC', weeks: 2, head: 1100, back: 650, dem: [1300, 800], path: cat(chan, [[-20, 49], [-40, 46.5], [-52, 43.6], [-62, 42.3], [-70, 40.7], [-74, 40.5]])},
  {id: 'IE', name: 'Akdeniz – Kuzey Avrupa', a: 'IST', b: 'RTM', weeks: 1, head: 450, back: 350, dem: [600, 500], path: cat(istGib, gibRtm)},
  {id: 'GM', name: 'Körfez – Akdeniz', a: 'JEA', b: 'IST', weeks: 2, head: 800, back: 700, dem: [600, 500], suez: true, path: cat(gulfAden, redSea, suezIst)},
  {id: 'AG', name: 'Asya – Körfez', a: 'SHA', b: 'JEA', weeks: 2, head: 900, back: 350, dem: [1200, 500], path: cat(shaSin, malacca, toGulf)},
  {id: 'SA', name: 'Güney Amerika – Avrupa', a: 'SSZ', b: 'RTM', weeks: 3, head: 1300, back: 800, dem: [800, 600], path: cat([[-46.3, -24], [-42.5, -24.6], [-36.5, -18], [-32, -8], [-30, 1], [-27, 12], [-21.5, 22], [-18, 30], [-13, 38], [-10.3, 43.6]], rev(chan))},
  {id: 'AF', name: 'Asya – Güney Afrika', a: 'SIN', b: 'DUR', weeks: 2, head: 950, back: 400, dem: [500, 280], path: cat(malacca.slice(0, 5), [[80, -5], [62, -19], [50, -27.6], [38, -30.5], [31.1, -29.9]])},
  {id: 'MU', name: 'Akdeniz – ABD Doğu', a: 'IST', b: 'NYC', weeks: 3, head: 1500, back: 700, dem: [900, 500], path: cat(istGib, [[-10, 36.4], [-30, 38.6], [-50, 40.2], [-65, 40.4], [-74, 40.5]])},
];
const LM = Object.fromEntries(LANES.map(l => [l.id, l]));
const KY = 1.35; // enlem ölçeği (harita 2:1)
LANES.forEach(l => { // yol geometrisi
  l.segs = []; l.len = 0;
  for (let i = 1; i < l.path.length; i++) { const a = l.path[i - 1], b = l.path[i]; if (!a || !b) continue;
    const len = Math.hypot(b[0] - a[0], (b[1] - a[1]) * KY); l.segs.push({a, b, len}); l.len += len; }
});
function posAt(l, f) { let d = clamp(f, 0, 1) * l.len;
  for (const s of l.segs) { if (d <= s.len) { const t = s.len ? d / s.len : 0; return {lon: s.a[0] + (s.b[0] - s.a[0]) * t, lat: s.a[1] + (s.b[1] - s.a[1]) * t, ang: Math.atan2(-(s.b[1] - s.a[1]) * KY, s.b[0] - s.a[0])}; } d -= s.len; }
  const s = l.segs[l.segs.length - 1]; return {lon: s.b[0], lat: s.b[1], ang: 0}; }
const from = (l, d) => PORTS[d ? l.b : l.a].n, to = (l, d) => PORTS[d ? l.a : l.b].n;

    if (s.hid > 0) { s.left = s.hid; s.total += s.hid; R.note(`${CM[s.c].name} rötar bildirdi: ${s.cust}, +${s.hid} hafta`, 'bad'); s.hid = 0; s.delayed = true; continue; }
    const late = Math.max(0, G.week + 1 - s.due); G.sh = G.sh.filter(x => x !== s); G.st.del++; G.st.teu += s.teu;
    R.pay(`Teslim: ${s.cust} · ${s.teu} TEU ${to(LM[s.lane], s.dir)}`, s.rev);
    if (late) { G.st.late++; R.pay(`Gecikme cezası (${late} hafta)`, -Math.min(.6, .12 * late * (G.up.ins ? .5 : 1)) * s.rev, 'bad'); G.rep = clamp(G.rep - (G.up.track ? 3 : 4) * late, 0, 100); }
    else G.rep = clamp(G.rep + (G.up.track ? 2 : 1), 0, 100); }
  if (G.cash < 0) R.pay('Kredi faizi (%1)', G.cash * .01);
  if (Math.random() < .1 && G.sh.length) { const s = pick(G.sh); s.left++; s.total++; s.delayed = true; R.note(`Gümrük denetimi: ${s.cust} yükü 1 hafta bekleyecek`, 'bad'); }
  stepMarket(G, R);
  G.contracts = G.contracts.filter(c => { c.used = 0; if (--c.left <= 0) { R.note(`${LM[c.lane].name} blok yer anlaşması sona erdi`); return false; } R.pay(`Blok yer: ${LM[c.lane].name} (${c.cap} TEU)`, -c.cap * c.rate); return true; });
  G.week++; genOffers(G); G.hist.push(valueF(G)); closeReport(G, R);
  if (G.cash < -G.credit) G.over = 'bust'; else if (G.week > WEEKS) G.over = 'done';
  return R; }

/* ───────── Senaryo 2: Armatör (hat operatörü) ───────── */
const CLS = {
  F: {n: 'Feeder', cap: 1100, price: 4e6, fuel: 25, opex: 35e3, port: 30e3, canal: 80e3},
  S: {n: 'Sub-Panamax', cap: 2500, price: 8.5e6, fuel: 46, opex: 48e3, port: 50e3, canal: 180e3},
  P: {n: 'Panamax', cap: 4200, price: 14e6, fuel: 70, opex: 60e3, port: 70e3, canal: 300e3},
  N: {n: 'Neo-Panamax', cap: 9000, price: 30e6, fuel: 120, opex: 85e3, port: 140e3, canal: 550e3},
};
const SPD = {e: {n: 'Ekonomik', dw: 1, fm: .62}, n: {n: 'Normal', dw: 0, fm: 1}, f: {n: 'Tam yol', dw: -1, fm: 1.7}};
const WINDS = ['Lodos', 'İmbat', 'Karayel', 'Yıldız', 'Keşişleme', 'Gündoğusu', 'Samyeli', 'Meltem', 'Günbatısı', 'Bora', 'Kıble', 'Etezyen'];
const C_TIERS = [[35e6, 'Suyun üstünde'], [50e6, 'Düzenli hat operatörü'], [70e6, 'Okyanus armatörü']];
const valF = G => .75 + .25 * avgIdx(G);
const shipVal = (G, s) => s.hire ? 0 : CLS[s.cls].price * valF(G) * .92;
const fleetVal = G => G.fleet.reduce((s, x) => s + shipVal(G, x), 0);
const netC = G => G.cash + fleetVal(G) - G.debt;
const loanCap = G => Math.floor(fleetVal(G) * .5 / 1e6) * 1e6;
const pf = p => Math.min(2.2, Math.pow(1 / p, 2.5));
const inflow = (G, l, d) => l.dem[d] * demMult(G) * pf(G.price[l.id]) * (.6 + G.rep / 150);
function mkShip(G, cls, hire) { const used = G.fleet.map(s => s.name); const nm = WINDS.find(w => !used.includes('M/V ' + w)) || 'Rüzgâr ' + G.seq;
  return {id: G.seq++, name: 'M/V ' + nm, cls, hire: hire || 0, until: hire ? G.week + 6 : 0, lane: null, dir: 0, state: 'idle', left: 0, total: 0, load: 0, speed: 'n', vs: 'n', next: null, late: false}; }
function newCarrier() { const G = {mode: 'car', week: 1, cash: 1e6, debt: 0, rep: 60, price: {}, pool: {}, fleet: [], list: [], m: newMarket(), log: [], hist: [], seq: 1, st: {teu: 0, cap: 0, voy: 0, late: 0}};
  LANES.forEach(l => { G.price[l.id] = 1; G.pool[l.id] = [l.dem[0] * 2, l.dem[1] * 2]; });
  const a = mkShip(G, 'F'); G.fleet.push(a); const b = mkShip(G, 'S'); G.fleet.push(b);
  a.lane = 'IE'; b.lane = 'AM'; depart(G, a); depart(G, b); genList(G); G.hist.push(netC(G)); return G; }
function depart(G, sh, R, agg) { const l = LM[sh.lane], c = CLS[sh.cls], d = sh.dir, pool = G.pool[l.id];
  const load = Math.min(c.cap, Math.floor(pool[d])); pool[d] -= load;
  const rev = load * Math.round(rate(G, l, d) * G.price[l.id]);
  const cost = c.port + 40 * load + (l.suez && !G.m.ev.some(e => e.k === 'suez') ? c.canal : 0);
  sh.vs = sh.speed; sh.state = 'sea'; sh.left = sh.total = Math.max(1, laneWeeks(G, l) + SPD[sh.vs].dw); sh.load = load; sh.late = false;
  G.st.teu += load; G.st.cap += c.cap;
  if (R) { R.pay(`${sh.name} · ${from(l, d)} → ${to(l, d)} · ${nf.format(load)}/${nf.format(c.cap)} TEU`, rev); agg.port += cost; } else G.cash += rev - cost; }
function genList(G) { const ks = Object.keys(CLS), v = valF(G);
  const mk = type => { const cls = pick(ks), p = CLS[cls].price * v; return {id: G.seq++, cls, type, price: type === 'sale' ? Math.round(p * rnd(.9, 1.12) / 1e5) * 1e5 : Math.round(p * .035 * rnd(.9, 1.15) / 1e3) * 1e3}; };
  G.list = [mk('sale'), mk('charter'), mk(Math.random() < .5 ? 'sale' : 'charter')]; }
function assign(G, id, v) { const s = G.fleet.find(x => x.id === id); if (!s) return;
  if (s.state === 'sea') s.next = v === s.lane ? null : v;
  else if (!v) { s.state = 'idle'; s.lane = null; s.left = 0; }
  else { s.lane = v; s.state = 'repo'; s.left = s.total = 1; s.dir = 0; s.vs = s.speed; s.next = null; } }
function endWeekC(G) { const R = mkReport(G), agg = {fuel: 0, opex: 0, hire: 0, port: 0};
  LANES.forEach(l => [0, 1].forEach(d => { const g = inflow(G, l, d); G.pool[l.id][d] = Math.min(G.pool[l.id][d] + g, g * 3); }));
  for (const s of G.fleet) { const c = CLS[s.cls]; agg.opex += c.opex; agg.hire += s.hire;
    if (s.state === 'idle') continue;
    agg.fuel += c.fuel * 7 * G.m.bunker * SPD[s.vs].fm;
    if (--s.left > 0) continue;
    if (s.state === 'sea') { G.st.voy++;
      if (s.late) { G.st.late++; G.rep = clamp(G.rep - 3, 0, 100); R.note(`${s.name} ${to(LM[s.lane], s.dir)} limanına rötarlı vardı`, 'bad'); } else G.rep = clamp(G.rep + .5, 0, 100);
      s.dir = 1 - s.dir; s.load = 0;
      if (s.next !== null) { const nx = s.next; s.next = null; if (!nx) { s.state = 'idle'; s.lane = null; continue; } s.lane = nx; s.state = 'repo'; s.left = s.total = 1; s.dir = 0; continue; } }
    else s.dir = 0;
    depart(G, s, R, agg); }
  R.pay('Liman, elleçleme ve kanal ücretleri', -agg.port); R.pay('Yakıt', -agg.fuel); R.pay('Mürettebat ve bakım', -agg.opex); R.pay('Gemi kirası', -agg.hire);
  if (G.debt) R.pay('Kredi faizi (%0,3)', -G.debt * .003);
  if (G.cash < 0) R.pay('Kasa açığı faizi (%1)', G.cash * .01);
  const sea = G.fleet.filter(s => s.state === 'sea');
  if (Math.random() < .08 && sea.length) { const s = pick(sea), c = CLS[s.cls]; s.left++; s.total++; s.late = true; R.pay(`${s.name} makine arızası: onarım`, -c.opex * 3, 'bad'); }
  stepMarket(G, R); genList(G);
  G.week++; G.hist.push(netC(G)); closeReport(G, R);
  if (G.cash < -2e6) G.over = 'bust'; else if (G.week > WEEKS) G.over = 'done';
  return R; }

function spark(a, w = 84, h = 22) { a = a.slice(-16); if (a.length < 2) a = [a[0], a[0]]; const mn = Math.min(...a), mx = Math.max(...a), sp = mx - mn || 1;
  const pts = a.map((v, i) => [(i / (a.length - 1)) * (w - 6) + 3, h - 3 - ((v - mn) / sp) * (h - 6)]); const e = pts[pts.length - 1];
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${pts.map(p => p.map(n => n.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="${e[0].toFixed(1)}" cy="${e[1].toFixed(1)}" r="2.4" fill="var(--magenta)"/></svg>`; }

  sell: d => { const G = S.G, s = G.fleet.find(x => x.id === +d.id); if (s && !s.hire && G.fleet.length > 1) { G.cash += shipVal(G, s) * .95; G.fleet = G.fleet.filter(x => x !== s); } },
  ret: d => { const G = S.G, s = G.fleet.find(x => x.id === +d.id); if (s && s.hire && G.week >= s.until) G.fleet = G.fleet.filter(x => x !== s); },
  loan: d => { const G = S.G; if (+d.d > 0 && G.debt + 1e6 <= loanCap(G)) { G.debt += 1e6; G.cash += 1e6; } else if (+d.d < 0 && G.debt >= 1e6 && G.cash >= 1e6) { G.debt -= 1e6; G.cash -= 1e6; } },
};
document.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (!b || b.disabled) return; const a = b.dataset.act; ACT[a](b.dataset);
  if (!['end', 'menu', 'final', 'start', 'home', 'resume', 'close'].includes(a)) { const id = b.id; render(); if (id) { const n = document.getElementById(id); if (n) n.focus(); } } });
document.addEventListener('change', e => { const s = e.target.closest('[data-chg]'); if (!s) return; assign(S.G, +s.dataset.id, s.value); const id = s.id; render(); const n = document.getElementById(id); if (n) n.focus(); });
const setHi = id => { if (id === S.hi) return; S.hi = id; $('#hi-name').textContent = id ? LM[id].name : ''; draw(); };
$('#desk').addEventListener('pointerover', e => { const c = e.target.closest('[data-lane]'); setHi(c && c.dataset.lane ? c.dataset.lane : null); });
$('#desk').addEventListener('pointerleave', () => setHi(null));
$('#desk').addEventListener('focusin', e => { const c = e.target.closest('[data-lane]'); if (c && c.dataset.lane) setHi(c.dataset.lane); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#dlg').hidden && S.G && !S.G.over) ACT.close(); });

new ResizeObserver(resize).observe(cv.parentElement);
new ResizeObserver(() => document.documentElement.style.setProperty('--hud-h', $('#bridge').offsetHeight + 'px')).observe($('#bridge'));
const retheme = () => { if (W) { buildLand(); draw(); } };
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', retheme);
new MutationObserver(retheme).observe(document.documentElement, {attributes: true, attributeFilter: ['data-theme']});
if (document.fonts && document.fonts.ready) document.fonts.ready.then(retheme);

window.KONSIMENTO = {S, start, endWeek, book, score, LANES, CARR, CLS, ACT, laneWeeks, rate, assign, loanCap};
function boot(data) { if (data && data.G) { S.G = data.G; S.tab = data.tab || ''; } render(); resize(); demo(); }
const hot = window.claude && window.claude.hot;
if (hot && hot.snapshot) hot.snapshot(() => ({G: S.G, tab: S.tab}));
if (hot && hot.ready) hot.ready(boot); else boot((hot && hot.data) || {});
})();
</script>
