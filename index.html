<!doctype html>
<html lang="tr">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Konşimento</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/style.css">

<div id="app" lang="tr">
  <header class="bridge" id="bridge"><div class="bridge-in">
    <div class="mark"><i></i>KONŞİMENTO <small id="mode-tag">9 LİMAN · 10 HAT · 2 SENARYO</small></div>
    <div class="hud" id="hud"></div>
    <div class="bridge-btns" id="bridge-btns"></div>
  </div></header>
  <div class="wrap">
    <section class="chart-col" aria-label="Seyir haritası">
      <div class="chart"><canvas id="cv" role="img" aria-label="Limanları ve hatları gösteren dünya haritası"></canvas></div>
      <div class="chart-foot"><div class="key" id="key"></div><div id="hi-name" class="num"></div></div>
      <div class="notices" id="notices"></div>
    </section>
    <section class="desk" id="desk"></section>
  </div>
  <div class="dlg" id="dlg" hidden></div>
</div>

<script src="js/geo.js"></script>
<script src="js/core.js"></script>
<script src="js/forwarder.js"></script>
